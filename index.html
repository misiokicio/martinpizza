    <style>
        /* Mobile Device Responsive Overrides (< 768px) */
        @media only screen and (max-width: 767px) {
          .navbar-brand, .logo, .site-title {
            font-size: 1.2rem !important; 
            max-width: 60% !important;
          }
          .navbar-nav, .menu, .nav-menu {
            margin-top: 10px !important;
          }
          body {
            padding-top: 80px !important; 
          }
          header, .site-header, #header {
            padding: 10px 0 !important;
            min-height: 60px !important;
          }
          .bg-video {
            display: none !important;
          }

          /* Premium Mobile App Style Menu Layout Engines */
          .menu-card-container {
            height: auto !important; 
          }
          .menu-card {
            transform: none !important;
            transform-style: flat !important;
            display: flex !important;
            flex-direction: column !important; 
          }
          .menu-card-container:hover .menu-card {
            transform: none !important; 
          }
          .card-front, .card-back {
            position: relative !important;
            width: 100% !important;
            backface-visibility: visible !important;
            transform: none !important;
          }
          .card-back {
            order: 1 !important; 
            height: 200px !important; 
            border-radius: 12px 12px 0 0 !important;
            border-bottom: none !important;
          }
          .card-front {
            order: 2 !important; 
            border-radius: 0 0 12px 12px !important;
            border-top: none !important;
            padding: 1.5rem !important;
          }
          .card-back-title {
            display: none !important; 
          }
          
          /* Mobile spacing adjustments for new structures */
          .trust-bar {
            gap: 12px 20px !important;
            padding: 1.5rem 5% !important;
          }
        }
          
        /* Progress Bar Styles */
        .progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 4px; z-index: 1001; }
        .progress-bar { height: 4px; background: var(--gold); width: 0%; box-shadow: 0 0 10px var(--gold); }
        
        :root { --gold: #fffd82; --bg: #000; --f-bg: #111; --whatsapp: #25D366; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #fff; scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        header { background: rgba(0,0,0,0.95); position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; box-sizing: border-box; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 1.3rem; font-weight: bold; } .logo span { color: var(--gold); }
        nav ul { list-style: none; display: flex; gap: 1.0rem; margin: 0; padding: 0; font-size: 0.85rem; }
        
        /* #home Styles */
        #home { 
            position: relative; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            background: url('hero1-trailer.jpg') center top / cover; 
            padding: 80px 10%; 
            box-sizing: border-box; 
            overflow: hidden;
        }
        .bg-video { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: translate(-50%, -50%); 
            z-index: 1; 
            display: none; 
        }
        .hero-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.60)); 
            z-index: 2; 
        }
        .hero-content { 
            position: relative; 
            z-index: 3; 
            margin-top: 140px; 
        }
        #home h1 { font-size: clamp(2.5rem, 8vw, 4rem); margin: 0; line-height: 1.1; } #home h1 span { color: var(--gold); }
        .btn { background: var(--gold); color: #000; padding: 1rem 2rem; border-radius: 50px; font-weight: bold; margin-top: 25px; display: inline-block; }
        
        /* Premium Trust Checkmarks Bar Styles */
        .trust-bar {
            background: #080808;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 1.2rem 5%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        .trust-item {
            font-size: 0.9rem;
            font-weight: 600;
            color: #eee;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .trust-item span {
            color: var(--gold);
            font-size: 1.1rem;
        }

        /* Stats Styles */
        .stats { background: var(--gold); color: #000; display: grid; grid-template-columns: repeat(2, 1fr); padding: 2rem 5%; text-align: center; gap: 20px; }
        @media (min-width: 768px) { .stats { grid-template-columns: repeat(4, 1fr); } }
        .stat h3 { margin: 0; font-size: 1.3rem; } .stat p { margin: 0; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        section { padding: 80px 8%; box-sizing: border-box; clear: both; }
        section h2 { font-size: clamp(2rem, 6vw, 2.5rem); text-align: center; margin-bottom: 1.5rem; } section h2::after { content: ''; display: block; width: 50px; height: 3px; background: var(--gold); margin: 10px auto; }
        
        /* 3D Flip Card Layout Engine Styles (Desktop Default) */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.8rem; }
        
        .menu-card-container { 
            perspective: 1000px; 
            height: 350px; 
            cursor: pointer;
        }
        
        .menu-card { 
            width: 100%; 
            height: 100%; 
            position: relative; 
            transform-style: preserve-3d; 
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        .menu-card-container:hover .menu-card { 
            transform: rotateY(180deg); 
        }
        
        .card-front, .card-back { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 12px; 
            box-sizing: border-box; 
        }
        
        .card-front { 
            background: var(--f-bg); 
            padding: 1.8rem; 
            border: 1px solid rgba(255,255,255,0.08); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            z-index: 2;
            transform: rotateY(0deg);
        }
        
        .card-back { 
            background-size: cover; 
            background-position: center; 
            transform: rotateY(180deg); 
            border: 2px solid var(--gold); 
            display: flex;
            align-items: flex-end;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        
        .card-back-title {
            color: #fff;
            font-weight: bold;
            font-size: 1.25rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 14px;
            border-radius: 6px;
            border-left: 3px solid var(--gold);
        }
        
        .card-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            gap: 10px;
            margin-bottom: 8px; 
        }
        .menu-card h3 { color: var(--gold); margin: 0; font-size: 1.35rem; font-weight: 600; }
        .menu-tag { 
            background: rgba(255, 253, 130, 0.1); 
            color: var(--gold); 
            font-size: 0.7rem; 
            font-weight: bold; 
            padding: 4px 10px; 
            border-radius: 20px; 
            white-space: nowrap;
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        .menu-card p { color: #aaa; font-size: 0.9rem; line-height: 1.4; margin: 0 0 15px 0; }
        .menu-specs { 
            border-top: 1px solid rgba(255,255,255,0.06); 
            padding-top: 12px; 
            font-size: 0.85rem; 
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .menu-specs div { color: #888; }
        .menu-specs strong { color: #eee; font-weight: 500; }
        
        /* Dough Feature Styles */
        .dough-feature { background: #050505; border-top: 1px solid #222; border-bottom: 1px solid #222; display: flex; align-items: center; flex-wrap: wrap; gap: 40px; padding: 60px 8%; }
        .dough-text { flex: 1; min-width: 300px; }
        .dough-text h2 { text-align: left; margin-bottom: 20px; }
        .dough-text h2::after { margin: 10px 0; }
        .dough-text p { line-height: 1.8; color: #ccc; font-size: 1.1rem; }
        .dough-highlight { color: var(--gold); font-weight: bold; }
        .dough-image { flex: 1; min-width: 300px; text-align: center; }
        .dough-image img { width: 100%; max-width: 500px; border-radius: 15px; box-shadow: 0 0 30px rgba(255, 253, 130, 0.1); }
        
        /* "How It Works" 3-Step Section Styles */
        .steps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2.2rem;
            margin-top: 2rem;
        }
        .step-card {
            background: var(--f-bg);
            padding: 2.5rem 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }
        .step-number {
            font-size: 4.5rem;
            font-weight: 900;
            color: rgba(255, 253, 130, 0.05);
            position: absolute;
            top: -0.5rem;
            right: 0.8rem;
            line-height: 1;
        }
        .step-card h3 {
            color: var(--gold);
            margin: 0 0 12px 0;
            font-size: 1.3rem;
            font-weight: 600;
        }
        .step-card p {
            color: #aaa;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0;
        }

        /* WhatsApp Direct Integration Styles */
        .whatsapp-prompt {
            text-align: center;
            margin-top: 20px;
            font-size: 0.95rem;
            color: #ccc;
        }
        .whatsapp-prompt a {
            color: var(--whatsapp);
            font-weight: bold;
            text-decoration: underline;
        }
        .whatsapp-prompt a:hover {
            color: #fff;
        }

        /* Gallery Styles */
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (min-width: 768px) { .gallery { grid-template-columns: repeat(4, 1fr); } }
        .gallery img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; transition: 0.3s;}
        .gallery img:hover { transform: scale(1.05);}
        
        /* Testimonials Styles */
        .testimonials { background: #0a0a0a; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; }
        .testimonial-card { background: #111; padding: 2rem; border-radius: 15px; border-left: 4px solid var(--gold); position: relative; }
        .testimonial-card p { font-style: italic; font-size: 0.95rem; line-height: 1.6; color: #ccc; }
        .testimonial-card h4 { margin-top: 15px; color: var(--gold); font-size: 1rem; }
        .stars { color: var(--gold); margin-bottom: 10px; font-size: 0.8rem; }
        
        /* Form & Hire Styles */
        #hire { max-width: 600px; margin: 0 auto; }
        form { background: var(--f-bg); padding: 2rem; border-radius: 10px; display: flex; flex-direction: column; gap: 1.2rem; }
        input, select, textarea { padding: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; width: 100%; box-sizing: border-box; font-size: 16px; }
        .submit { background: var(--gold); color: #000; padding: 16px; border: none; border-radius: 6px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        
        /* Footer Styles */
        footer { background: #080808; text-align: center; padding: 40px 5%; border-top: 1px solid rgba(255,255,255,0.1); }
        .social { display: flex; justify-content: center; gap: 25px; margin-bottom: 20px; } .social svg { width: 30px; height: 30px; fill: #fff; }
        .contact p { margin: 8px 0; } .contact a { color: var(--gold); font-weight: bold; }
        .contact .wa-footer-link { color: var(--whatsapp) !important; font-weight: bold; }
    </style>
</head>
